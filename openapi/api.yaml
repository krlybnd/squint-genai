openapi: 3.1.0
info:
  title: agentic-api
  description: Documents, indexing jobs, retrieval, and annotations REST API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: boolean
                type: object
                title: Response Ready Ready Get
  /v1/documents:
    get:
      tags:
      - documents
      summary: List Documents
      operationId: list_documents_v1_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
  /v1/documents/{document_id}:
    get:
      tags:
      - documents
      summary: Get Document
      operationId: get_document_v1_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - documents
      summary: Delete Document
      operationId: delete_document_v1_documents__document_id__delete
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/upload/presign:
    post:
      tags:
      - documents
      summary: Presign Upload
      operationId: presign_upload_v1_documents_upload_presign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{document_id}/upload:
    put:
      tags:
      - documents
      summary: Upload Document Bytes
      operationId: upload_document_bytes_v1_documents__document_id__upload_put
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{document_id}/reindex:
    post:
      tags:
      - documents
      summary: Reindex Document
      operationId: reindex_document_v1_documents__document_id__reindex_post
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexDocumentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{document_id}/complete:
    post:
      tags:
      - documents
      summary: Complete Upload
      operationId: complete_upload_v1_documents__document_id__complete_post
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/index:
    post:
      tags:
      - admin
      summary: Trigger Reindex All
      operationId: trigger_reindex_all_v1_admin_index_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexAllResponse'
  /v1/admin/jobs/{job_id}:
    get:
      tags:
      - admin
      summary: Get Job
      operationId: get_job_v1_admin_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieval/search:
    post:
      tags:
      - retrieval
      summary: Search Documents
      operationId: search_documents_v1_retrieval_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieval/sources/{chunk_id}:
    get:
      tags:
      - retrieval
      summary: Get Source Citation
      operationId: get_source_citation_v1_retrieval_sources__chunk_id__get
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieval/indexed-documents:
    get:
      tags:
      - retrieval
      summary: List Indexed Documents
      operationId: list_indexed_documents_v1_retrieval_indexed_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IndexedDocumentOut'
                type: array
                title: Response List Indexed Documents V1 Retrieval Indexed Documents
                  Get
  /v1/retrieval/documents/{doc_id}/chunks:
    get:
      tags:
      - retrieval
      summary: List Document Chunks
      operationId: list_document_chunks_v1_retrieval_documents__doc_id__chunks_get
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChunksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieval/documents/by-source/{source_file}/chunks:
    get:
      tags:
      - retrieval
      summary: List Source File Chunks
      operationId: list_source_file_chunks_v1_retrieval_documents_by_source__source_file__chunks_get
      parameters:
      - name: source_file
        in: path
        required: true
        schema:
          type: string
          title: Source File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChunksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/vault/detokenize:
    post:
      tags:
      - vault
      summary: Detokenize
      operationId: detokenize_v1_vault_detokenize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetokenizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetokenizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/annotations/chunks/{chunk_id}/comments:
    get:
      tags:
      - annotations
      summary: List Chunk Comments
      operationId: list_chunk_comments_v1_annotations_chunks__chunk_id__comments_get
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChunkCommentOut'
                title: Response List Chunk Comments V1 Annotations Chunks  Chunk Id  Comments
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - annotations
      summary: Create Chunk Comment
      operationId: create_chunk_comment_v1_annotations_chunks__chunk_id__comments_post
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChunkCommentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkCommentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ChunkComment:
      properties:
        point_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Point Type
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        doc_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Id
        source_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File
        page:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Page
        page_label:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Page Label
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
        _node_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Node Content
        comment_id:
          type: string
          minLength: 1
          title: Comment Id
        selected_text:
          type: string
          title: Selected Text
          default: ''
        comment_text:
          type: string
          minLength: 1
          title: Comment Text
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        created_at:
          type: string
          title: Created At
          default: ''
      type: object
      required:
      - comment_id
      - comment_text
      title: ChunkComment
      description: Comment embedded in a chunk's Qdrant payload (`comments` list).
    ChunkCommentOut:
      properties:
        comment_id:
          type: string
          title: Comment Id
        chunk_id:
          type: string
          title: Chunk Id
        selected_text:
          type: string
          title: Selected Text
        comment_text:
          type: string
          title: Comment Text
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: string
          title: Created At
      type: object
      required:
      - comment_id
      - chunk_id
      - selected_text
      - comment_text
      - created_at
      title: ChunkCommentOut
    ChunkOut:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
        text:
          type: string
          title: Text
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        doc_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Id
        source_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File
        page:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page
        comments:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChunkComment'
            type: array
          - type: 'null'
          title: Comments
      type: object
      required:
      - chunk_id
      - text
      title: ChunkOut
    CitationOut:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
        page:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
        source_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File
        doc_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Id
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - chunk_id
      title: CitationOut
    CompleteUploadResponse:
      properties:
        document:
          $ref: '#/components/schemas/DocumentOut'
        job_id:
          type: string
          format: uuid
          title: Job Id
          description: Celery indexing job id
      type: object
      required:
      - document
      - job_id
      title: CompleteUploadResponse
    CreateChunkCommentRequest:
      properties:
        selected_text:
          type: string
          maxLength: 4000
          minLength: 1
          title: Selected Text
        comment_text:
          type: string
          maxLength: 2000
          minLength: 2
          title: Comment Text
      type: object
      required:
      - selected_text
      - comment_text
      title: CreateChunkCommentRequest
    DetokenizeRequest:
      properties:
        tokens:
          items:
            type: string
          type: array
          title: Tokens
          description: Vault tokens to resolve (e.g. '<PERSON_a1b2c3d4>').
      type: object
      title: DetokenizeRequest
    DetokenizeResponse:
      properties:
        values:
          additionalProperties:
            type: string
          type: object
          title: Values
          description: Resolved token → plaintext for the current tenant only.
      type: object
      title: DetokenizeResponse
    DocumentChunksResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        source_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File
        chunks:
          items:
            $ref: '#/components/schemas/ChunkOut'
          type: array
          title: Chunks
      type: object
      required:
      - doc_id
      - chunks
      title: DocumentChunksResponse
    DocumentListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DocumentOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: DocumentListResponse
    DocumentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        filename:
          type: string
          title: Filename
        minio_key:
          type: string
          title: Minio Key
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        indexed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Indexed At
        index_status:
          $ref: '#/components/schemas/IndexStatus'
          default: pending
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - filename
      - minio_key
      - page_count
      - indexed_at
      - created_at
      title: DocumentOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    IndexAllResponse:
      properties:
        job_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Job Ids
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: IndexAllResponse
    IndexStatus:
      type: string
      enum:
      - indexed
      - indexing
      - failed
      - pending
      title: IndexStatus
    IndexedDocumentOut:
      properties:
        doc_id:
          type: string
          title: Doc Id
        source_file:
          type: string
          title: Source File
        chunk_count:
          type: integer
          title: Chunk Count
      type: object
      required:
      - doc_id
      - source_file
      - chunk_count
      title: IndexedDocumentOut
    JobOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        document_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Document Id
        celery_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Celery Task Id
        status:
          type: string
          title: Status
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_at:
          type: string
          title: Created At
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - document_id
      - celery_task_id
      - status
      - error_message
      - created_at
      - completed_at
      title: JobOut
    PresignUploadRequest:
      properties:
        filename:
          type: string
          maxLength: 512
          minLength: 1
          title: Filename
      type: object
      required:
      - filename
      title: PresignUploadRequest
    PresignUploadResponse:
      properties:
        document:
          $ref: '#/components/schemas/DocumentOut'
        upload_url:
          type: string
          title: Upload Url
          description: PUT target URL (via API proxy to object storage)
        expires_in:
          type: integer
          title: Expires In
          description: URL validity in seconds
        content_type:
          type: string
          title: Content Type
          default: application/pdf
      type: object
      required:
      - document
      - upload_url
      - expires_in
      title: PresignUploadResponse
    ReindexDocumentResponse:
      properties:
        document:
          $ref: '#/components/schemas/DocumentOut'
        job_id:
          type: string
          format: uuid
          title: Job Id
          description: Celery reindexing job id
      type: object
      required:
      - document
      - job_id
      title: ReindexDocumentResponse
    SearchRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        top_k:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top K
      type: object
      required:
      - query
      title: SearchRequest
    SearchResponse:
      properties:
        chunks:
          items:
            $ref: '#/components/schemas/ChunkOut'
          type: array
          title: Chunks
      type: object
      required:
      - chunks
      title: SearchResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
