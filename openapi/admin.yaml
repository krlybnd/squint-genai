openapi: 3.1.0
info:
  title: Squint Admin API
  description: Tenant and user administration (Keycloak Organizations)
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: boolean
                type: object
                title: Response Ready Ready Get
  /v1/tenants:
    get:
      tags:
      - tenants
      summary: List Tenants
      operationId: list_tenants_v1_tenants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
    post:
      tags:
      - tenants
      summary: Create Tenant
      operationId: create_tenant_v1_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tenants/{alias}:
    patch:
      tags:
      - tenants
      summary: Update Tenant
      operationId: update_tenant_v1_tenants__alias__patch
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tenants
      summary: Delete Tenant
      operationId: delete_tenant_v1_tenants__alias__delete
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tenants/{alias}/members:
    get:
      tags:
      - tenants
      summary: List Tenant Members
      operationId: list_tenant_members_v1_tenants__alias__members_get
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      - name: first
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: First
      - name: max
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Max
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMemberListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - tenants
      summary: Add Tenant Member
      operationId: add_tenant_member_v1_tenants__alias__members_post
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTenantMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMemberOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tenants/{alias}/members/{username}:
    delete:
      tags:
      - tenants
      summary: Remove Tenant Member
      operationId: remove_tenant_member_v1_tenants__alias__members__username__delete
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users:
    get:
      tags:
      - users
      summary: List Users
      operationId: list_users_v1_users_get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: first
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: First
      - name: max
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Max
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - users
      summary: Create User
      operationId: create_user_v1_users_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/{username}:
    get:
      tags:
      - users
      summary: Get User
      operationId: get_user_v1_users__username__get
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - users
      summary: Update User
      operationId: update_user_v1_users__username__patch
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/{username}/tenant:
    post:
      tags:
      - users
      summary: Assign User Tenant
      operationId: assign_user_tenant_v1_users__username__tenant_post
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTenantRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Remove User Tenant
      operationId: remove_user_tenant_v1_users__username__tenant_delete
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/{username}/active-tenant:
    put:
      tags:
      - users
      summary: Set Active User Tenant
      operationId: set_active_user_tenant_v1_users__username__active_tenant_put
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveTenantRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/{username}/tenants/{alias}:
    delete:
      tags:
      - users
      summary: Remove User From Tenant
      operationId: remove_user_from_tenant_v1_users__username__tenants__alias__delete
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddTenantMemberRequest:
      properties:
        username:
          type: string
          maxLength: 255
          minLength: 1
          title: Username
      type: object
      required:
      - username
      title: AddTenantMemberRequest
    AssignTenantRequest:
      properties:
        alias:
          type: string
          maxLength: 255
          minLength: 1
          title: Alias
        set_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Set Active
          description: Set JWT active tenant_id; default true only when user has no
            active tenant
      type: object
      required:
      - alias
      title: AssignTenantRequest
    CreateTenantRequest:
      properties:
        alias:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Alias
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
      type: object
      required:
      - alias
      - name
      title: CreateTenantRequest
    CreateUserRequest:
      properties:
        username:
          type: string
          maxLength: 255
          minLength: 1
          title: Username
        email:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 4
          title: Password
        realm_roles:
          items:
            type: string
          type: array
          title: Realm Roles
      type: object
      required:
      - username
      - password
      title: CreateUserRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    SetActiveTenantRequest:
      properties:
        alias:
          type: string
          maxLength: 255
          minLength: 1
          title: Alias
      type: object
      required:
      - alias
      title: SetActiveTenantRequest
    TenantListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TenantOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: TenantListResponse
    TenantMemberListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TenantMemberOut'
          type: array
          title: Items
        first:
          type: integer
          title: First
          default: 0
        max:
          type: integer
          title: Max
          default: 50
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
      - items
      title: TenantMemberListResponse
    TenantMemberOut:
      properties:
        id:
          type: string
          title: Id
        username:
          type: string
          title: Username
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
      type: object
      required:
      - id
      - username
      - email
      title: TenantMemberOut
    TenantOut:
      properties:
        id:
          type: string
          title: Id
        alias:
          type: string
          title: Alias
        name:
          type: string
          title: Name
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - id
      - alias
      - name
      - enabled
      title: TenantOut
    UpdateTenantRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        enabled:
          type: boolean
          title: Enabled
          default: true
      type: object
      required:
      - name
      title: UpdateTenantRequest
    UpdateUserRequest:
      properties:
        email:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        realm_roles:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Realm Roles
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
          description: Tenant alias to assign; empty string removes tenant; omit to
            leave unchanged
        password:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 4
          - type: 'null'
          title: Password
      type: object
      title: UpdateUserRequest
    UserListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserOut'
          type: array
          title: Items
        first:
          type: integer
          title: First
          default: 0
        max:
          type: integer
          title: Max
          default: 50
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
      - items
      title: UserListResponse
    UserOut:
      properties:
        id:
          type: string
          title: Id
        username:
          type: string
          title: Username
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        enabled:
          type: boolean
          title: Enabled
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        tenant_ids:
          items:
            type: string
          type: array
          title: Tenant Ids
        realm_roles:
          items:
            type: string
          type: array
          title: Realm Roles
      type: object
      required:
      - id
      - username
      - email
      - enabled
      - tenant_id
      - tenant_ids
      - realm_roles
      title: UserOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
