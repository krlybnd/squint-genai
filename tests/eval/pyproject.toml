[project]
name = "agentic-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentic-chat",
    "agentic-shared",
    "deepeval>=4.1.5",
    "langgraph>=0.2",
    "pytest>=8.0",
]

[tool.uv.sources]
agentic-shared = { path = "../../packages/shared", editable = true }
agentic-chat = { path = "../../services/chat", editable = true }

[dependency-groups]
dev = [
    "coverage>=7.6",
    "ruff>=0.8",
]

[tool.ruff]
extend = "../../ruff.toml"
src = ["."]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [".", "tests"]
markers = ["eval: live RAG evaluation"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
