[project]
name = "agentic-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentic-chat",
    "agentic-shared",
    "deepeval>=4.1.5",
    "langgraph>=0.2",
    "pydantic-evals>=2.35.1",
    "pydantic-settings>=2.6",
    "pytest>=8.0",
    "python-dotenv>=1.2.3",
]

[tool.uv.sources]
agentic-shared = { path = "../../packages/shared", editable = true }
agentic-chat = { path = "../../services/chat", editable = true }

[dependency-groups]
dev = [
    "coverage>=7.6",
    "ruff>=0.8",
]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["eval: live RAG evaluation", "integration: needs running stack"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_eval"]

[tool.uv]
package = true
