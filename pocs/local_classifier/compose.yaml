# PoC only — not part of the root docker compose stack.
name: local-classifier-poc

services:
  llm-guard:
    image: laiyer/llm-guard-api:latest
    ports:
      - "8010:8000"
    environment:
      AUTH_TOKEN: poc-local-classifier
      LOG_LEVEL: INFO
      APP_WORKERS: "1"
      # Persist HF / transformer downloads under ./run
      HF_HOME: /data/hf
      TRANSFORMERS_CACHE: /data/hf/transformers
      HUGGINGFACE_HUB_CACHE: /data/hf/hub
    volumes:
      - ./config/scanners.yml:/home/user/app/config/scanners.yml:ro
      - ./run/hf-cache:/data/hf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
    ports:
      - "5002:3000"
    environment:
      WORKERS: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    ports:
      - "5001:3000"
    environment:
      WORKERS: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
