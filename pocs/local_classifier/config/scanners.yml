# Keep in sync with operations/llm-guard for PoC smoke (BanSubstrings + PromptInjection).

app:
  name: local-classifier-poc
  log_level: ${LOG_LEVEL:INFO}
  log_json: false
  scan_fail_fast: true
  scan_prompt_timeout: 60
  scan_output_timeout: 60
  lazy_load: true

rate_limit:
  enabled: false

auth:
  type: http_bearer
  token: ${AUTH_TOKEN:poc-local-classifier}

tracing:
  exporter: console

metrics:
  exporter: prometheus

input_scanners:
  - type: BanSubstrings
    params:
      substrings:
        - "squint-e2e-banned"
        - "motherfucker"
        - "fuck you"
      match_type: str
      case_sensitive: false
      redact: false
      contains_all: false
  - type: PromptInjection
    params:
      threshold: 0.85
      match_type: full

output_scanners: []
