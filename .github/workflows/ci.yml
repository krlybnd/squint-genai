name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  repo-map:
    name: repo-map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install CUE and verify repo map
        run: |
          go install cuelang.org/go/cmd/cue@v0.11.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          make verify-repo-map

  python-project:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: packages/shared
            name: shared
          - project: services/api
            name: api
          - project: services/chat
            name: chat
          - project: services/admin
            name: admin
          - project: services/indexing
            name: indexing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"

      - name: Generate Keycloak admin client
        if: matrix.name == 'admin'
        run: make generate-keycloak-client

      - name: Sync (frozen)
        working-directory: ${{ matrix.project }}
        run: uv sync --frozen

      - name: Lint
        run: make -C ${{ matrix.project }} lint

      - name: Unit tests + coverage
        run: make -C ${{ matrix.project }} unit-test-coverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-reports-${{ matrix.name }}
          path: .reports/python/${{ matrix.name }}/
          include-hidden-files: true
          retention-days: 14

  python-suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: tests/eval
            name: eval
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"

      - name: Sync (frozen)
        working-directory: ${{ matrix.project }}
        run: uv sync --frozen

      - name: Run suite
        run: make -C ${{ matrix.project }} run

  node-project:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: packages/ui-core
            name: ui-core
            workspace: "@are/ui-core"
          - project: frontend/app-ui
            name: app-ui
            workspace: "@are/app-ui"
          - project: frontend/admin-app-ui
            name: admin-app-ui
            workspace: "@are/admin-app-ui"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }}

      - name: Unit tests
        run: npm run test -w ${{ matrix.workspace }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-reports-${{ matrix.name }}
          path: .reports/node/${{ matrix.name }}/
          retention-days: 14

  licenses:
    name: license-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Keycloak admin client
        run: make generate-keycloak-client

      - name: Sync all projects (frozen)
        run: make sync-frozen

      - name: SBOM merge + license policy gate
        run: make licenses

      - name: Upload merged SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-bom
          path: |
            licenses/bom.cdx.json
            .reports/licenses/bom.cdx.json
          retention-days: 14

  coverage-aggregate:
    name: coverage-combine
    runs-on: ubuntu-latest
    needs: [python-project]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-reports-*
          path: .reports/_ci-artifacts

      - name: Normalize Python report paths
        run: |
          mkdir -p .reports/python
          for name in shared api chat admin indexing; do
            src=".reports/_ci-artifacts/python-reports-${name}"
            if [ -d "$src" ]; then
              mkdir -p ".reports/python/${name}"
              cp -a "${src}/." ".reports/python/${name}/"
            fi
          done

      - name: Sync shared (for coverage CLI)
        working-directory: packages/shared
        run: uv sync --frozen

      - name: Combine coverage (non-gating)
        run: make coverage-combine

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: .reports/coverage/combined/
          retention-days: 14

  publish-stable:
    name: publish-stable
    needs:
      - repo-map
      - python-project
      - python-suite
      - node-project
      - licenses
      - coverage-aggregate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download combined coverage
        continue-on-error: true
        id: download-coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-combined
          path: coverage

      - name: Ensure coverage directory exists
        run: mkdir -p coverage

      - name: Download merged SBOM
        uses: actions/download-artifact@v4
        with:
          name: licenses-bom
          path: .

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update stable tag
        run: |
          git tag -fa stable -m "Stable build from ${GITHUB_SHA}"
          git push origin stable --force

      - name: Publish stable release with SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          gh release delete stable --yes 2>/dev/null || true
          gh release create stable \
            licenses/bom.cdx.json \
            --title "Stable" \
            --notes "Automated stable build from [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Combined Python unit coverage is published to GitHub Pages when available; CycloneDX SBOM attached." \
            --latest

      # Pages requires a public repo or paid plan; keep main green when unavailable.
      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage

      - name: Deploy coverage to GitHub Pages
        id: deploy-pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
