[project]
name = "agentic-admin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentic-shared",
    "keycloak-admin-client",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "dishka>=1.4",
]

[tool.uv.sources]
agentic-shared = { path = "../../packages/shared", editable = true }
keycloak-admin-client = { path = "../../packages/generated/keycloak-admin-client", editable = true }

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_admin"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/unittest"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src"]
branch = false
omit = [
    "**/main.py",
    "**/router.py",
    "**/providers.py",
    "**/factory.py",
    "**/bootstrap.py",
    "**/configure.py",
    "**/binder.py",
    "**/checkpointer.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.coverage.html]
title = "agentic-admin Coverage"
