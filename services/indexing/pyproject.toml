[project]
name = "agentic-indexing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentic-shared",
    "celery>=5.4",
    "redis>=5.2",
    "psycopg2-binary>=2.9",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-embeddings-openai>=0.3",
    "qdrant-client>=1.12",
]

[tool.uv.sources]
agentic-shared = { path = "../../packages/shared", editable = true }

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_indexing"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/unittest"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src"]
branch = false
omit = [
    "**/main.py",
    "**/router.py",
    "**/providers.py",
    "**/factory.py",
    "**/bootstrap.py",
    "**/configure.py",
    "**/binder.py",
    "**/checkpointer.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.coverage.html]
title = "agentic-indexing Coverage"
