services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm --features=organization
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-agentic}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      KC_HOSTNAME: localhost
      # Browser talks to :8080 on the default demo. Traefik overlay: KC_HOSTNAME_PORT=80.
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Only the realm export — Keycloak 26 --import-realm treats every *.json
      # in this directory as a realm. user-profile.json is REST payload for init.
      - ./realm/agentic-rag-eval-realm.json:/opt/keycloak/data/import/agentic-rag-eval-realm.json:ro

  keycloak-init:
    image: alpine:3.21
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ../..:/workspace:ro
      - ./realm:/realm:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agentic-rag-eval}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      REALM_DIR: /realm
      WORKSPACE: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache curl jq make >/dev/null && sh /workspace/scripts/keycloak/init-organizations.sh
    restart: on-failure
